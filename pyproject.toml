[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ai"
version = "0.1.0"
description = "Production-grade AI system combining retrieval over company filings with structured financial data and agentic reasoning."
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "PYI",
]